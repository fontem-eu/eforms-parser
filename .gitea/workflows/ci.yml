name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install package + dev extras
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          # `--no-build-isolation` skips pip's per-install setuptools
          # bootstrap, which our Nexus proxy doesn't carry.
          pip install --no-cache-dir --upgrade setuptools wheel
          pip install --no-cache-dir --no-build-isolation -e '.[dev]'
          pip install --no-cache-dir pytest-cov
      - name: pytest with coverage
        run: |
          python3 -m pytest tests/ -q \
            --cov=src --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Lint
        run: python3 -m pylint src/eforms tests

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install + coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir --upgrade setuptools wheel
          pip install --no-cache-dir --no-build-isolation -e '.[dev]'
          pip install --no-cache-dir pytest-cov cyclonedx-bom
          python3 -m pytest tests/ -q --cov=src --cov-report=xml:coverage.xml || true
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
      - name: Generate SBOM (resolved versions from installed env)
        # Library — no Docker image, no Dependency-Track project to
        # track CVEs against (it'd duplicate findings from any
        # consumer that vendors it). Still generate the SBOM so we
        # have a portable record per release; upload it to DT under
        # the same "eforms-parser" project name as consumer SBOMs
        # would reference, so a CVE on this lib propagates upward
        # via DT's outdated-component metric.
        run: cyclonedx-py environment --of json -o sbom.json
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -fsS -X POST "http://dependency-track.dependency-track.svc.cluster.local:8080/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "projectName=eforms-parser" \
            -F "projectVersion=v$(git rev-parse --short HEAD)" \
            -F "autoCreate=true" \
            -F "bom=@sbom.json"
